name: Set up Bun and install dependencies
description: Set up the pinned Bun version, restore its cache, and install locked dependencies

inputs:
  bun-version:
    description: Bun version to install
    required: false
    default: "1.3.4"
  working-directory:
    description: Directory in which to run bun install
    required: false
    default: "."
  lockfile:
    description: Repository-relative lockfile path used for the cache key
    required: false
    default: "bun.lock"
  cache-key-suffix:
    description: Optional suffix appended after the bun cache key prefix
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Set up Bun
      uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
      with:
        bun-version: ${{ inputs.bun-version }}

    - name: Restore Bun cache
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.0.0
      with:
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-bun${{ inputs.cache-key-suffix }}-${{ hashFiles(inputs.lockfile) }}
        restore-keys: |
          ${{ runner.os }}-bun${{ inputs.cache-key-suffix }}-
          ${{ runner.os }}-bun-

    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: bun install --frozen-lockfile
