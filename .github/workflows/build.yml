name: Build

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "public/**"
      - "prisma/**"
      - "Dockerfile"
      - "next.config.*"
      - "postcss.config.*"
      - "tailwind.config.*"
      - "tsconfig.json"
      - "eslint.config.*"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/**"
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "public/**"
      - "prisma/**"
      - "Dockerfile"
      - "next.config.*"
      - "postcss.config.*"
      - "tailwind.config.*"
      - "tsconfig.json"
      - "eslint.config.*"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/**"

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  BUN_VERSION: "1.3.4"

jobs:
  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      - name: Set up Bun and install dependencies
        uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Build application
        run: bun run build
