name: Prisma

on:
  push:
    branches:
      - main
    paths:
      - "prisma/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/prisma.yml"
  pull_request:
    branches:
      - main
    paths:
      - "prisma/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/prisma.yml"

concurrency:
  group: prisma-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  BUN_VERSION: "1.3.4"

jobs:
  validate:
    name: Validate Prisma schema
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      - name: Set up Bun and install dependencies
        uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ env.BUN_VERSION }}
          cache-key-suffix: -prisma

      - name: Create .env for Prisma (DATABASE_URL only)
        run: cp .env.example .env

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Validate Prisma schema
        run: bunx prisma validate
