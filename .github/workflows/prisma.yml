name: Prisma

on:
  push:
    branches:
      - main
    paths:
      - "prisma/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/prisma.yml"
  pull_request:
    branches:
      - main
    paths:
      - "prisma/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/prisma.yml"

concurrency:
  group: prisma-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  BUN_VERSION: "1.3.4"

jobs:
  validate:
    name: Validate Prisma schema
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Bun and install dependencies
        uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ env.BUN_VERSION }}
          cache-key-suffix: -prisma

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Validate Prisma schema
        run: bunx prisma validate
