name: Mini-services

on:
  push:
    branches:
      - main
    paths:
      - "mini-services/**"
      - ".github/workflows/mini-services.yml"
  pull_request:
    branches:
      - main
    # No `paths` filter on purpose: "Validate order-book" and "Validate
    # tick-stream" are required status checks on main. A workflow that never
    # triggers leaves those checks pending forever, which permanently blocks
    # the merge button. The push trigger above still filters on main.

concurrency:
  group: mini-services-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  BUN_VERSION: "1.4.2"

jobs:
  order-book:
    name: Validate order-book
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mini-services/order-book
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      - name: Set up Bun and install dependencies
        uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ env.BUN_VERSION }}
          working-directory: mini-services/order-book
          lockfile: mini-services/order-book/bun.lock
          cache-key-suffix: -order-book

      # Boots the service the way docker-compose does and asserts /health plus
      # the socket.io engine path — neither of which an install can verify.
      - name: Smoke-test (boot + /health + socket.io path)
        timeout-minutes: 3
        working-directory: .
        run: bash mini-services/validate-service.sh mini-services/order-book order-book 3004

  tick-stream:
    name: Validate tick-stream
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mini-services/tick-stream
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      - name: Set up Bun and install dependencies
        uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ env.BUN_VERSION }}
          working-directory: mini-services/tick-stream
          lockfile: mini-services/tick-stream/bun.lock
          cache-key-suffix: -tick-stream

      # Boots the service the way docker-compose does and asserts /health plus
      # the socket.io engine path — neither of which an install can verify.
      - name: Smoke-test (boot + /health + socket.io path)
        timeout-minutes: 3
        working-directory: .
        run: bash mini-services/validate-service.sh mini-services/tick-stream tick-stream 3005
