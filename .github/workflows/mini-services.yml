name: Mini-services

on:
  push:
    branches:
      - main
    paths:
      - "mini-services/**"
      - ".github/workflows/mini-services.yml"
  pull_request:
    branches:
      - main
    paths:
      - "mini-services/**"
      - ".github/workflows/mini-services.yml"

concurrency:
  group: mini-services-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  BUN_VERSION: "1.3.4"

jobs:
  order-book:
    name: Validate order-book
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mini-services/order-book
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Restore Bun cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-order-book-${{ hashFiles('mini-services/order-book/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-order-book-
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

  tick-stream:
    name: Validate tick-stream
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mini-services/tick-stream
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Restore Bun cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-tick-stream-${{ hashFiles('mini-services/tick-stream/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-tick-stream-
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile
