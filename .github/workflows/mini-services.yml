name: Mini-services

on:
  push:
    branches:
      - main
    paths:
      - "mini-services/**"
      - ".github/workflows/mini-services.yml"
  pull_request:
    branches:
      - main
    paths:
      - "mini-services/**"
      - ".github/workflows/mini-services.yml"

concurrency:
  group: mini-services-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  BUN_VERSION: "1.3.4"

jobs:
  order-book:
    name: Validate order-book
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mini-services/order-book
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      - name: Set up Bun and install dependencies
        uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ env.BUN_VERSION }}
          working-directory: mini-services/order-book
          lockfile: mini-services/order-book/bun.lock
          cache-key-suffix: -order-book

  tick-stream:
    name: Validate tick-stream
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mini-services/tick-stream
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      - name: Set up Bun and install dependencies
        uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ env.BUN_VERSION }}
          working-directory: mini-services/tick-stream
          lockfile: mini-services/tick-stream/bun.lock
          cache-key-suffix: -tick-stream
