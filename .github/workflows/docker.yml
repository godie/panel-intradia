name: Docker image

on:
  push:
    branches:
      - main
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - ".env.example"
      - "package.json"
      - "package-lock.json"
      - "bun.lock"
      - "src/**"
      - "public/**"
      - "prisma/**"
      - "mini-services/**"
      - "next.config.*"
      - "postcss.config.*"
      - "tailwind.config.*"
      - "tsconfig.json"
      - "eslint.config.*"
      - ".github/workflows/docker.yml"
  pull_request:
    branches:
      - main
    # No `paths` filter on purpose: "Build Docker image" is a required status
    # check on main. A workflow that never triggers leaves that check pending
    # forever, which permanently blocks the merge button. The push trigger
    # above still filters on main.

concurrency:
  group: docker-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: panelcuantitativo/app:ci-${{ github.sha }}
