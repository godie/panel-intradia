name: Docker image

on:
  push:
    branches:
      - main
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - ".env.example"
      - "package.json"
      - "package-lock.json"
      - "bun.lock"
      - "src/**"
      - "public/**"
      - "prisma/**"
      - "mini-services/**"
      - "next.config.*"
      - "postcss.config.*"
      - "tailwind.config.*"
      - "tsconfig.json"
      - "eslint.config.*"
      - ".github/workflows/docker.yml"
  pull_request:
    branches:
      - main
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - ".env.example"
      - "package.json"
      - "package-lock.json"
      - "bun.lock"
      - "src/**"
      - "public/**"
      - "prisma/**"
      - "mini-services/**"
      - "next.config.*"
      - "postcss.config.*"
      - "tailwind.config.*"
      - "tsconfig.json"
      - "eslint.config.*"
      - ".github/workflows/docker.yml"

concurrency:
  group: docker-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: panelcuantitativo/app:ci-${{ github.sha }}
